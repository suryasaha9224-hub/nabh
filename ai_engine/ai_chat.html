<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Support Chat | NABH Guardian</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        /* PITCH BLACK THEME */
                        darkBg: '#000000',    
                        darkCard: '#111111',  
                        darkBorder: '#262626', 
                        slate: {
                            50: '#fafafa', 100: '#f5f5f5', 200: '#e5e5e5', 300: '#d4d4d4',
                            400: '#a3a3a3', 500: '#737373', 600: '#525252', 700: '#404040',
                            800: '#262626', 900: '#171717', 950: '#0a0a0a',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; transition: background-color 0.3s ease; }
        .dark-transition { transition: background-color 0.3s, border-color 0.3s, color 0.3s; }
        .custom-scroll::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 10px; }
        .dark .custom-scroll::-webkit-scrollbar-thumb { background: #404040; }
        
        /* Bouncing dots for AI thinking state */
        .typing-dot { animation: typing 1.4s infinite ease-in-out both; }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typing { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
    </style>
</head>
<body class="bg-slate-50 dark:bg-darkBg dark:text-slate-200 flex flex-col h-screen overflow-hidden dark-transition relative z-0">

    <main class="flex-1 overflow-hidden w-full px-3 py-4 md:px-8 md:py-6 flex flex-col relative">
        
        <!-- Theme Toggle Floating Button -->
        <button onclick="toggleDarkMode()" class="absolute top-6 right-6 md:top-8 md:right-10 p-2 rounded-lg bg-slate-100 dark:bg-slate-800 border border-transparent dark:border-darkBorder text-slate-600 dark:text-amber-400 hover:scale-105 transition-transform z-50 shadow-sm">
            <svg id="theme-sun" class="w-4 h-4 md:w-5 md:h-5 hidden dark:block" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"></path></svg>
            <svg id="theme-moon" class="w-4 h-4 md:w-5 md:h-5 block dark:hidden" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
        </button>

        <!-- Active Chat Interface -->
        <section id="chat-view" class="max-w-4xl w-full mx-auto bg-white dark:bg-darkCard rounded-xl md:rounded-3xl shadow-sm border border-gray-200 dark:border-darkBorder overflow-hidden flex-col flex-1 h-full flex transition-all">
            
            <!-- Card Header / Status Banner -->
            <div class="p-3 md:p-4 border-b border-gray-100 dark:border-darkBorder bg-slate-50/50 dark:bg-slate-900/20 flex justify-between items-center shrink-0">
                <div class="flex items-center space-x-3">
                    <div class="relative">
                        <div class="w-10 h-10 bg-indigo-100 dark:bg-indigo-900/30 text-indigo-600 dark:text-indigo-400 rounded-full flex items-center justify-center font-bold border border-indigo-200 dark:border-indigo-800">
                            <!-- AI Sparkle Icon -->
                            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M11.644 1.59a.75.75 0 01.712 0l9.75 5.25a.75.75 0 010 1.32l-9.75 5.25a.75.75 0 01-.712 0l-9.75-5.25a.75.75 0 010-1.32l9.75-5.25z"></path><path d="M3.265 10.602l7.668 4.129a2.25 2.25 0 002.134 0l7.668-4.13a.75.75 0 01.714 1.318l-7.668 4.13a3.75 3.75 0 01-3.558 0l-7.668-4.13a.75.75 0 01.712-1.317z"></path><path d="M3.265 15.102l7.668 4.129a2.25 2.25 0 002.134 0l7.668-4.13a.75.75 0 01.714 1.318l-7.668 4.13a3.75 3.75 0 01-3.558 0l-7.668-4.13a.75.75 0 01.712-1.317z"></path></svg>
                        </div>
                        <div class="w-3 h-3 bg-emerald-500 border-2 border-white dark:border-darkCard rounded-full absolute bottom-0 right-0"></div>
                    </div>
                    <div>
                        <h3 class="font-bold text-slate-800 dark:text-white text-sm md:text-base tracking-tight">AI Virtual Assistant</h3>
                        <p class="text-[9px] md:text-[10px] text-slate-500 mt-0.5 uppercase tracking-widest font-bold">Automated Support System</p>
                    </div>
                </div>
                <div class="text-right mr-10 md:mr-16">
                    <p class="text-[9px] md:text-[10px] font-bold text-emerald-600 dark:text-emerald-400 uppercase tracking-widest bg-emerald-100 dark:bg-emerald-900/30 px-2.5 py-1 rounded">Online</p>
                </div>
            </div>

            <!-- Chat History Area -->
            <div id="chat-history" class="flex-1 overflow-y-auto custom-scroll p-4 md:p-6 space-y-5 bg-slate-50/30 dark:bg-darkBg/50 relative flex flex-col">
                
                <!-- Initial Welcome Message from AI -->
                <div class="flex justify-start msg-bubble">
                    <div class="bg-white dark:bg-darkCard text-slate-800 dark:text-slate-200 border border-gray-200 dark:border-darkBorder rounded-t-2xl rounded-r-2xl p-3 px-4 max-w-[85%] md:max-w-md shadow-sm">
                        <p class="text-[9px] md:text-[10px] font-bold text-indigo-500 dark:text-indigo-400 mb-1.5 uppercase tracking-widest flex items-center">
                            <svg class="w-3 h-3 mr-1" fill="currentColor" viewBox="0 0 24 24"><path d="M11.644 1.59a.75.75 0 01.712 0l9.75 5.25a.75.75 0 010 1.32l-9.75 5.25a.75.75 0 01-.712 0l-9.75-5.25a.75.75 0 010-1.32l9.75-5.25z"></path></svg>
                            AI Assistant
                        </p>
                        <p class="text-xs md:text-sm whitespace-pre-wrap leading-relaxed font-medium">Hello! I am your AI Support Assistant. How can I help you with your assets, reports, or system issues today?</p>
                    </div>
                </div>

            </div>

            <!-- Chat Input Area -->
            <form id="chat-form" onsubmit="sendMessage(event)" class="bg-white dark:bg-darkCard border-t border-gray-100 dark:border-darkBorder p-3 md:p-5 shrink-0 flex items-end space-x-2 md:space-x-3 relative z-10">
                <div class="flex-1 bg-slate-50 dark:bg-slate-900 border border-gray-200 dark:border-darkBorder rounded-xl overflow-hidden focus-within:ring-2 focus-within:ring-indigo-500 transition-all">
                    <textarea id="chat-input" rows="1" placeholder="Ask me anything..." class="w-full bg-transparent px-4 py-3.5 text-xs md:text-sm text-slate-800 dark:text-white outline-none resize-none custom-scroll" oninput="this.style.height = ''; this.style.height = Math.min(this.scrollHeight, 120) + 'px'"></textarea>
                </div>
                <button type="submit" id="send-btn" class="w-12 h-11 md:w-14 md:h-[50px] bg-indigo-600 text-white rounded-xl flex items-center justify-center hover:bg-indigo-700 active:scale-95 transition-all shadow-md shrink-0 focus:outline-none">
                    <svg class="w-5 h-5 md:w-6 md:h-6 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                </button>
            </form>

        </section>
    </main>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900 dark:bg-slate-800 border border-slate-700 text-white px-6 py-2.5 rounded-xl text-[10px] md:text-sm font-bold shadow-2xl opacity-0 transition-all pointer-events-none z-[500] whitespace-nowrap"></div>

    <script>
        // Directly using the API Key in internal Javascript
        const GEMINI_API_KEY = "";

        document.addEventListener('DOMContentLoaded', () => {
            // Apply Theme
            if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            }

            // Enter key to send handling
            document.getElementById('chat-input').addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    document.getElementById('chat-form').dispatchEvent(new Event('submit'));
                }
            });
        });

        function toggleDarkMode() {
            const html = document.documentElement;
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
        }

        function showError(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.className = "fixed bottom-6 left-1/2 -translate-x-1/2 bg-red-600 border border-red-700 text-white px-6 py-2.5 rounded-xl text-[10px] md:text-sm font-bold shadow-2xl transition-all z-[500] whitespace-nowrap opacity-100 translate-y-[-10px]";
            setTimeout(() => { t.classList.remove('opacity-100', 'translate-y-[-10px]'); t.classList.add('opacity-0'); }, 4000);
        }

        // --- Basic Markdown Parser for AI Responses ---
        function parseFormatting(text) {
            // Escape basic HTML first for security
            let safeText = text.replace(/[&<>"']/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
            // Convert markdown bold (**text**) to HTML bold
            safeText = safeText.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            // Convert markdown italic (*text*) to HTML italic
            safeText = safeText.replace(/\*(.*?)\*/g, '<em>$1</em>');
            return safeText;
        }

        async function sendMessage(e) {
            e.preventDefault();
            const input = document.getElementById('chat-input');
            const messageText = input.value.trim();
            const btn = document.getElementById('send-btn');
            const container = document.getElementById('chat-history');
            
            if (!messageText) return;

            // 1. Append User Message
            const timeStr = new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
            container.insertAdjacentHTML('beforeend', `
                <div class="flex justify-end msg-bubble animate-in slide-in-from-right-4 duration-300">
                    <div class="bg-indigo-600 text-white rounded-t-2xl rounded-l-2xl p-3 px-4 max-w-[85%] md:max-w-md shadow-md">
                        <p class="text-xs md:text-sm whitespace-pre-wrap leading-relaxed">${messageText.replace(/[&<>"']/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag))}</p>
                        <span class="text-[8px] md:text-[9px] text-indigo-200 block mt-1.5 text-right uppercase tracking-widest">${timeStr}</span>
                    </div>
                </div>
            `);
            
            // 2. Append AI "Thinking" State
            const tempId = 'ai-typing-' + Date.now();
            container.insertAdjacentHTML('beforeend', `
                <div id="${tempId}" class="flex justify-start msg-bubble animate-in slide-in-from-left-4 duration-300">
                    <div class="bg-white dark:bg-darkCard text-slate-800 dark:text-slate-200 border border-gray-200 dark:border-darkBorder rounded-t-2xl rounded-r-2xl p-3 px-4 shadow-sm">
                        <div class="flex space-x-1 items-center h-4 py-1 px-1">
                            <div class="w-1.5 h-1.5 bg-indigo-400 rounded-full typing-dot"></div>
                            <div class="w-1.5 h-1.5 bg-indigo-400 rounded-full typing-dot"></div>
                            <div class="w-1.5 h-1.5 bg-indigo-400 rounded-full typing-dot"></div>
                        </div>
                    </div>
                </div>
            `);

            container.scrollTop = container.scrollHeight;
            input.value = '';
            input.style.height = ''; 
            btn.disabled = true;

            // 3. Make Direct API Call to Google Gemini
            const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key=${GEMINI_API_KEY}`;
            
            const payload = {
                systemInstruction: {
                    role: "model",
                    parts: [
                        { text: "You are an intelligent support assistant for the 'AMAR' which stands for 'Advanced Management of Assets & Resourses' which is a hospital asset management system. Be concise, professional, and helpful. Use markdown for bolding important terms." }
                    ]
                },
                contents: [
                    {
                        role: "user",
                        parts: [{ text: messageText }]
                    }
                ],
                generationConfig: {
                    temperature: 0.7,
                    maxOutputTokens: 800
                }
            };

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                // Remove thinking bubble
                document.getElementById(tempId)?.remove();

                const json = await response.json();
                
                if (response.ok && json.candidates && json.candidates.length > 0) {
                    const aiReply = json.candidates[0].content.parts[0].text;
                    
                    // Append AI Answer
                    container.insertAdjacentHTML('beforeend', `
                        <div class="flex justify-start msg-bubble animate-in slide-in-from-left-4 duration-300">
                            <div class="bg-white dark:bg-darkCard text-slate-800 dark:text-slate-200 border border-gray-200 dark:border-darkBorder rounded-t-2xl rounded-r-2xl p-3 px-4 max-w-[85%] md:max-w-md shadow-sm">
                                <p class="text-[9px] md:text-[10px] font-bold text-indigo-500 dark:text-indigo-400 mb-1.5 uppercase tracking-widest flex items-center">
                                    <svg class="w-3 h-3 mr-1" fill="currentColor" viewBox="0 0 24 24"><path d="M11.644 1.59a.75.75 0 01.712 0l9.75 5.25a.75.75 0 010 1.32l-9.75 5.25a.75.75 0 01-.712 0l-9.75-5.25a.75.75 0 010-1.32l9.75-5.25z"></path></svg>
                                    AI Assistant
                                </p>
                                <p class="text-xs md:text-sm whitespace-pre-wrap leading-relaxed font-medium">${parseFormatting(aiReply)}</p>
                                <span class="text-[8px] md:text-[9px] text-slate-400 block mt-2 uppercase tracking-widest">${new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' })}</span>
                            </div>
                        </div>
                    `);
                } else {
                    const errorMsg = json.error ? json.error.message : 'Unknown API Format Error';
                    showError("AI Error: " + errorMsg);
                }
            } catch(e) {
                console.error("Fetch Error:", e);
                document.getElementById(tempId)?.remove();
                showError("Network error. Failed to connect to Gemini API.");
            }
            
            container.scrollTop = container.scrollHeight;
            btn.disabled = false;
            input.focus();
        }
    </script>
</body>
</html>
