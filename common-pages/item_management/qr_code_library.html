<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Export Asset QR Codes | AMAR</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- PDF & QR Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#000000',    
                        darkCard: '#111111',  
                        darkBorder: '#262626', 
                        slate: {
                            50: '#fafafa', 100: '#f5f5f5', 200: '#e5e5e5', 300: '#d4d4d4',
                            400: '#a3a3a3', 500: '#737373', 600: '#525252', 700: '#404040',
                            800: '#262626', 900: '#171717', 950: '#0a0a0a',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; transition: background-color 0.3s ease; }
        .custom-scroll::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #525252; border-radius: 10px; }
        .dark .custom-scroll::-webkit-scrollbar-thumb { background: #404040; }
        .table-row-transition { transition: all 0.2s ease; }
        input[type="checkbox"] { accent-color: #2563eb; cursor: pointer; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-darkBg dark:text-slate-200 min-h-screen overflow-x-hidden transition-colors duration-300">

    <main class="w-full max-w-7xl mx-auto p-4 md:p-6 space-y-4 md:space-y-6">
        
        <!-- Filter Section -->
        <section class="bg-white dark:bg-darkCard rounded-2xl border border-gray-200 dark:border-darkBorder shadow-sm p-4 md:p-6">
            <div class="flex items-center justify-between mb-4 border-b border-gray-100 dark:border-darkBorder pb-3">
                <div>
                    <h2 class="text-sm md:text-base font-bold text-slate-800 dark:text-white uppercase tracking-wider">Asset QR Generator</h2>
                    <p class="text-[9px] md:text-[10px] font-bold text-blue-600 dark:text-blue-400 uppercase tracking-widest mt-0.5">Filter & Select Items to Print</p>
                </div>
                <div class="flex items-center space-x-3">
                    <button onclick="toggleDarkMode()" class="p-1.5 rounded-lg bg-slate-100 dark:bg-slate-900 border border-transparent dark:border-darkBorder text-slate-600 dark:text-amber-400 transition-transform hover:scale-105">
                        <svg id="theme-sun" class="w-4 h-4 hidden dark:block" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"></path></svg>
                        <svg id="theme-moon" class="w-4 h-4 block dark:hidden" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
                    </button>
                    <div class="bg-blue-50 dark:bg-blue-900/30 border border-blue-200 dark:border-blue-800 text-blue-700 dark:text-blue-400 px-3 py-1.5 rounded-lg flex items-center shadow-sm">
                        <span class="text-[9px] uppercase font-bold tracking-widest mr-2">Visible Records</span>
                        <span id="total-count" class="font-extrabold text-sm">0</span>
                    </div>
                </div>
            </div>

            <!-- Filters -->
            <div class="grid grid-cols-2 md:grid-cols-5 gap-3 md:gap-4 items-end">
                <div class="col-span-2">
                    <label class="block text-[9px] md:text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1.5">Search Keywords</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                        </span>
                        <input type="text" id="search-input" onkeyup="filterItems()" placeholder="Name, Model, Serial..." 
                               class="w-full pl-9 pr-4 py-2.5 bg-slate-50 dark:bg-slate-900 border border-gray-200 dark:border-darkBorder rounded-xl outline-none focus:ring-2 focus:ring-blue-500 dark:text-white text-xs transition-all">
                    </div>
                </div>
                <div>
                    <label class="block text-[9px] md:text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1.5">Location Status</label>
                    <select id="status-filter" onchange="filterItems()" class="w-full px-3 py-2.5 bg-slate-50 dark:bg-slate-900 border border-gray-200 dark:border-darkBorder rounded-xl outline-none focus:ring-2 focus:ring-blue-500 dark:text-white text-xs font-semibold cursor-pointer transition-all">
                        <option value="all">All Active Items</option>
                        <option value="assigned">Currently Assigned</option>
                        <option value="unassigned">Unassigned (In Store)</option>
                        <option value="discarded">Discarded / Archived</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[9px] md:text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1.5">Department</label>
                    <select id="dept-filter" onchange="filterItems()" class="w-full px-3 py-2.5 bg-slate-50 dark:bg-slate-900 border border-gray-200 dark:border-darkBorder rounded-xl outline-none focus:ring-2 focus:ring-blue-500 dark:text-white text-xs font-semibold cursor-pointer transition-all">
                        <option value="all">All Departments</option>
                        <!-- Loaded dynamically -->
                    </select>
                </div>
                <div>
                    <label class="block text-[9px] md:text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1.5">Added Before</label>
                    <input type="date" id="date-added-filter" onchange="filterItems()" class="w-full px-3 py-2.5 bg-slate-50 dark:bg-slate-900 border border-gray-200 dark:border-darkBorder rounded-xl outline-none focus:ring-2 focus:ring-blue-500 dark:text-white text-xs transition-all cursor-pointer">
                </div>
            </div>
        </section>

        <!-- Master Table -->
        <section class="bg-white dark:bg-darkCard rounded-2xl border border-gray-200 dark:border-darkBorder shadow-sm flex flex-col overflow-hidden min-h-[400px]">
            <div class="flex-1 overflow-x-auto custom-scroll">
                <table class="w-full text-left border-collapse min-w-[1000px]">
                    <thead>
                        <tr class="bg-slate-50 dark:bg-slate-900 border-b border-gray-200 dark:border-darkBorder">
                            <th class="px-6 py-4 text-[10px] font-bold text-slate-500 uppercase tracking-widest">ID / Added On</th>
                            <th class="px-6 py-4 text-[10px] font-bold text-slate-500 uppercase tracking-widest">Asset Details</th>
                            <th class="px-6 py-4 text-[10px] font-bold text-slate-500 uppercase tracking-widest">Manufacturer</th>
                            <th class="px-6 py-4 text-[10px] font-bold text-slate-500 uppercase tracking-widest">Status / Location</th>
                            
                            <!-- Checkbox Column placed on the Right Side -->
                            <th class="px-6 py-4 text-center border-l border-gray-200 dark:border-darkBorder w-24">
                                <label class="flex flex-col items-center cursor-pointer">
                                    <input type="checkbox" id="master-checkbox" onchange="toggleSelectAll(this)" class="w-4 h-4 rounded shadow-sm">
                                    <span class="text-[8px] uppercase font-bold text-slate-400 mt-1">Select All</span>
                                </label>
                            </th>
                        </tr>
                    </thead>
                    <tbody id="inventory-table-body" class="divide-y divide-gray-100 dark:divide-darkBorder">
                        <!-- Loaded via AJAX -->
                    </tbody>
                </table>
                
                <!-- Loading State -->
                <div id="loader" class="py-20 text-center flex flex-col items-center">
                    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600 mb-3"></div>
                    <p class="text-xs font-bold text-slate-500 uppercase tracking-widest">Fetching Master Database...</p>
                </div>

                <!-- Empty State -->
                <div id="empty-state" class="hidden flex-col items-center justify-center py-20 text-slate-400">
                    <svg class="w-16 h-16 mx-auto mb-4 opacity-20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
                    <p class="text-sm font-bold uppercase tracking-widest">No items found matching criteria.</p>
                </div>
            </div>
        </section>

        <!-- Spacer for Floating Bar -->
        <div class="h-20"></div>

    </main>

    <!-- Floating Bulk Action Bar -->
    <div id="bulk-bar" class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-2xl hidden items-center justify-between bg-blue-600 text-white px-6 py-4 rounded-2xl shadow-2xl z-50 animate-in slide-in-from-bottom-6 duration-300">
        <div class="flex items-center space-x-4">
            <div class="w-10 h-10 bg-white/20 rounded-xl flex items-center justify-center">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm14 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"></path></svg>
            </div>
            <div>
                <p id="bulk-count-text" class="text-sm font-bold tracking-tight">0 items selected</p>
                <p class="text-[10px] opacity-80 uppercase tracking-widest font-medium">Ready to generate labels</p>
            </div>
        </div>
        <button id="btn-generate-pdf" onclick="generateQRPDF()" class="px-5 py-2.5 bg-white text-blue-600 hover:bg-slate-100 rounded-xl text-xs font-bold transition-all uppercase tracking-widest shadow-md flex items-center space-x-2">
            <span>Download Asset IDs</span>
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
        </button>
    </div>

    <!-- 
      CRITICAL FIX: 
      The hidden container must be positioned completely off-screen rather than using display:none. 
      qrcode.js cannot calculate canvas boundaries if display is none, resulting in a width/height 
      of 0 and causing corrupted or blank images when inserted into the PDF.
    -->
    <div id="hidden-qr-container" style="position: absolute; left: -9999px; top: -9999px;"></div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-24 left-1/2 -translate-x-1/2 px-6 py-3 rounded-2xl text-[10px] md:text-sm font-bold text-white shadow-2xl opacity-0 transition-all z-[600] whitespace-nowrap pointer-events-none"></div>

    <script>
        const activeUserId = localStorage.getItem('active_user_id');
        let allItemsData = [];
        let selectedItems = new Map(); // Store full asset objects

        // Setup jspdf
        const { jsPDF } = window.jspdf;

        // --- Theme Management ---
        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
        }
        if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }

        function showStatus(msg, isError = false) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.className = `fixed bottom-24 left-1/2 -translate-x-1/2 px-6 py-3 rounded-2xl text-[10px] md:text-sm font-bold text-white shadow-2xl transition-all z-[600] whitespace-nowrap ${isError ? 'bg-red-600' : 'bg-slate-900 dark:bg-slate-800'}`;
            t.classList.remove('opacity-0'); t.classList.add('translate-y-[-10px]', 'opacity-100');
            setTimeout(() => { t.classList.add('opacity-0'); t.classList.remove('translate-y-[-10px]', 'opacity-100'); }, 3000);
        }

        // --- Data Fetching ---
        document.addEventListener('DOMContentLoaded', async () => {
            if (!activeUserId) {
                showStatus("Unauthorized access.", true);
                return;
            }
            await fetchDepartments();
            await fetchInventory();
        });

        async function fetchDepartments() {
            try {
                const fd = new FormData();
                fd.append('action', 'fetch');
                fd.append('admin_id', activeUserId);
                
                const res = await fetch('../scripts/process_departments.php', { method: 'POST', body: fd });
                const json = await res.json();
                if(json.status === 'success') {
                    const sel = document.getElementById('dept-filter');
                    json.data.forEach(d => sel.innerHTML += `<option value="${d.dept_id}">${d.dept_name}</option>`);
                }
            } catch(e) {}
        }

        async function fetchInventory() {
            document.getElementById('loader').classList.remove('hidden');
            document.getElementById('empty-state').classList.add('hidden');
            
            try {
                const fd = new FormData();
                fd.append('admin_id', activeUserId);
                
                const res = await fetch('../scripts/fetch_all_items.php', { method: 'POST', body: fd });
                const json = await res.json();
                
                if(json.status === 'success') {
                    allItemsData = json.data;
                    filterItems(); 
                } else {
                    showStatus(json.message, true);
                }
            } catch(e) { 
                console.error(e);
                showStatus("Connection Error: Could not load inventory", true); 
            }
            document.getElementById('loader').classList.add('hidden');
        }

        // --- Date Formatter ---
        function formatDate(dateStr) {
            if (!dateStr || dateStr === 'nan') return 'N/A';
            const d = new Date(dateStr.replace(/-/g, "/"));
            if (isNaN(d)) return dateStr;
            return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        // --- Rendering ---
        function renderTable(data) {
            const tbody = document.getElementById('inventory-table-body');
            const empty = document.getElementById('empty-state');
            
            document.getElementById('total-count').innerText = data.length;
            tbody.innerHTML = '';
            
            if(data.length === 0) {
                empty.classList.remove('hidden');
                empty.classList.add('flex');
                return;
            }
            
            empty.classList.add('hidden');
            empty.classList.remove('flex');

            data.forEach(item => {
                const isDiscarded = item.is_discarded == 1 || item.is_discarded == '1' || item.is_discarded === true;
                const isAssigned = !isDiscarded && item.dept_name !== null && item.dept_name !== undefined && item.dept_name !== 'nan';
                
                let statusBadge = '';
                if (isDiscarded) {
                    statusBadge = `<span class="inline-flex items-center px-2.5 py-1 bg-red-100 dark:bg-red-900/30 text-red-700 dark:text-red-400 text-[10px] font-bold rounded-lg border border-red-200 dark:border-red-800 uppercase tracking-tighter">Discarded</span>`;
                } else if (isAssigned) {
                    statusBadge = `<span class="inline-flex items-center px-2.5 py-1 bg-emerald-100 dark:bg-emerald-900/30 text-emerald-700 dark:text-emerald-400 text-[10px] font-bold rounded-lg border border-emerald-200 dark:border-emerald-800 uppercase tracking-tighter">Assigned</span>`;
                } else {
                    statusBadge = `<span class="inline-flex items-center px-2.5 py-1 bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 text-[10px] font-bold rounded-lg border border-slate-200 dark:border-slate-700 uppercase tracking-tighter">Unassigned</span>`;
                }

                const assignmentDetails = isDiscarded 
                    ? `<p class="text-[10px] text-red-500 italic mt-1.5 font-bold">Permanently Archived</p>`
                    : (isAssigned 
                        ? `<p class="text-xs font-bold text-slate-800 dark:text-slate-200 mt-1">${item.dept_name}</p>
                           <p class="text-[9px] text-slate-500 uppercase mt-0.5">On ${formatDate(item.date_assigned)}</p>` 
                        : `<p class="text-[10px] text-slate-400 italic mt-1.5">In General Storage</p>`);

                const isChecked = selectedItems.has(String(item.item_id)) ? 'checked' : '';

                tbody.innerHTML += `
                    <tr class="table-row-transition hover:bg-slate-50 dark:hover:bg-slate-900/50 cursor-pointer group" onclick="document.getElementById('chk-${item.item_id}').click()">
                        <td class="px-6 py-4">
                            <p class="font-mono text-[11px] md:text-xs font-bold ${isDiscarded ? 'text-red-500 dark:text-red-400' : 'text-blue-600 dark:text-blue-400'}">#${item.item_id}</p>
                            <p class="text-[9px] text-slate-500 font-medium mt-1 uppercase">Added: ${formatDate(item.date_added)}</p>
                        </td>
                        <td class="px-6 py-4">
                            <p class="text-xs md:text-sm font-bold text-slate-800 dark:text-slate-200 uppercase">${item.item_name}</p>
                            <p class="text-[10px] text-slate-500 font-mono mt-0.5 uppercase tracking-tight">${item.item_model} • SN: ${item.serial_number}</p>
                        </td>
                        <td class="px-6 py-4 text-[11px] md:text-xs font-semibold text-slate-600 dark:text-slate-400 uppercase tracking-widest">${item.item_manufacturer}</td>
                        <td class="px-6 py-4">
                            <div class="flex flex-col items-start">
                                ${statusBadge}
                                ${assignmentDetails}
                            </div>
                        </td>
                        
                        <!-- Checkbox placed safely on the right edge -->
                        <td class="px-6 py-4 text-center border-l border-gray-100 dark:border-darkBorder">
                            <input type="checkbox" id="chk-${item.item_id}" class="w-4 h-4 rounded shadow-sm border-gray-300" ${isChecked} 
                                   onclick="event.stopPropagation()" onchange='toggleItemSelection(${JSON.stringify(item).replace(/'/g, "&#39;")}, this.checked)'>
                        </td>
                    </tr>`;
            });
            updateBulkUI();
        }

        // --- Filtering ---
        function filterItems() {
            const search = document.getElementById('search-input').value.toLowerCase().trim();
            const status = document.getElementById('status-filter').value;
            const dept = document.getElementById('dept-filter').value;
            const dateAdded = document.getElementById('date-added-filter').value;

            const filtered = allItemsData.filter(i => {
                const matchSearch = i.item_name.toLowerCase().includes(search) || 
                                    i.item_model.toLowerCase().includes(search) || 
                                    i.serial_number.toLowerCase().includes(search) ||
                                    (i.dept_name && i.dept_name.toLowerCase().includes(search)) ||
                                    (i.dept_id && i.dept_id.toLowerCase().includes(search));
                
                const isDiscarded = i.is_discarded == 1 || i.is_discarded == '1' || i.is_discarded === true;
                const isAssigned = !isDiscarded && i.dept_name !== null && i.dept_name !== undefined && i.dept_name !== 'nan';
                const isInStore = !isDiscarded && !isAssigned;
                
                let matchStatus = false;
                if(status === 'all') matchStatus = !isDiscarded; 
                else if(status === 'assigned') matchStatus = isAssigned;
                else if(status === 'unassigned') matchStatus = isInStore;
                else if(status === 'discarded') matchStatus = isDiscarded;

                let matchDept = true;
                if(dept !== 'all') {
                    matchDept = i.dept_id === dept;
                }

                let matchDate = true;
                if(dateAdded) {
                    const itemDate = i.date_added ? i.date_added.split(' ')[0] : '';
                    matchDate = itemDate <= dateAdded;
                }

                return matchSearch && matchStatus && matchDept && matchDate;
            });
            renderTable(filtered);
        }

        // --- Selection & Bulk UI ---
        function toggleItemSelection(item, isChecked) {
            const key = String(item.item_id);
            if (isChecked) {
                selectedItems.set(key, item);
            } else {
                selectedItems.delete(key);
                document.getElementById('master-checkbox').checked = false;
            }
            updateBulkUI();
        }

        function toggleSelectAll(masterCb) {
            const checkboxes = document.querySelectorAll('#inventory-table-body input[type="checkbox"]');
            
            // Re-run the filter logic to get currently visible items so we only select what's on screen
            const search = document.getElementById('search-input').value.toLowerCase().trim();
            const status = document.getElementById('status-filter').value;
            const dept = document.getElementById('dept-filter').value;
            
            const visibleItems = allItemsData.filter(i => {
                const matchSearch = i.item_name.toLowerCase().includes(search) || i.serial_number.toLowerCase().includes(search) || (i.dept_name && i.dept_name.toLowerCase().includes(search));
                const isDiscarded = i.is_discarded == 1 || i.is_discarded == '1' || i.is_discarded === true;
                const isAssigned = !isDiscarded && i.dept_name !== null && i.dept_name !== undefined && i.dept_name !== 'nan';
                let matchStatus = false;
                if(status === 'all') matchStatus = !isDiscarded; 
                else if(status === 'assigned') matchStatus = isAssigned;
                else if(status === 'unassigned') matchStatus = !isDiscarded && !isAssigned;
                else if(status === 'discarded') matchStatus = isDiscarded;
                let matchDept = true; if(dept !== 'all') matchDept = i.dept_id === dept;
                return matchSearch && matchStatus && matchDept;
            });

            checkboxes.forEach(cb => {
                cb.checked = masterCb.checked;
            });

            if (masterCb.checked) {
                visibleItems.forEach(item => selectedItems.set(String(item.item_id), item));
            } else {
                visibleItems.forEach(item => selectedItems.delete(String(item.item_id)));
            }

            updateBulkUI();
        }

        function updateBulkUI() {
            const bar = document.getElementById('bulk-bar');
            const countText = document.getElementById('bulk-count-text');
            const count = selectedItems.size;

            if (count > 0) {
                bar.classList.remove('hidden');
                bar.classList.add('flex');
                countText.innerText = `${count} equipment selected`;
            } else {
                bar.classList.add('hidden');
                bar.classList.remove('flex');
            }
        }

        // --- PDF Generation Logic ---
        
        // Helper function to extract base64 from qrcode.js
        async function generateQRBase64(text) {
            return new Promise((resolve) => {
                const container = document.getElementById('hidden-qr-container');
                container.innerHTML = ''; // clear
                
                new QRCode(container, {
                    text: text,
                    width: 256,
                    height: 256,
                    colorDark : "#000000",
                    colorLight : "#ffffff",
                    correctLevel : QRCode.CorrectLevel.H
                });
                
                // qrcode.js renders asynchronously. Wait slightly for canvas/img to generate.
                setTimeout(() => {
                    const canvas = container.querySelector('canvas');
                    if (canvas) {
                        resolve(canvas.toDataURL("image/png"));
                    } else {
                        const img = container.querySelector('img');
                        resolve(img.src);
                    }
                }, 150);
            });
        }

        async function generateQRPDF() {
            if (selectedItems.size === 0) return;
            
            const btn = document.getElementById('btn-generate-pdf');
            const origText = btn.innerHTML;
            btn.innerHTML = `<div class="animate-spin rounded-full h-4 w-4 border-b-2 border-white mx-auto"></div>`;
            btn.disabled = true;

            showStatus("Generating PDF... Please wait.");

            try {
                // Configure A4 PDF Document
                const doc = new jsPDF({ format: 'a4', unit: 'mm' });
                const startX = 12;
                const startY = 15;
                const labelW = 60; // mm width per label
                const labelH = 65; // mm height per label
                const marginX = 2; // space between columns
                const marginY = 4; // space between rows
                
                const cols = 3; 
                const rows = 4; // 3x4 grid = 12 labels per page
                
                let col = 0;
                let row = 0;

                // Grab items from Map
                const itemsArray = Array.from(selectedItems.values());

                for (let i = 0; i < itemsArray.length; i++) {
                    const item = itemsArray[i];

                    // Generate Universal URL targeting the reporting page natively
                    const baseUrl = window.location.origin + window.location.pathname.replace(/item_management\/.*\.html/, 'asset_report/asset_reporting.html');
                    
                    let queryParams = `?assets=${encodeURIComponent(item.item_name + ' (SN: ' + item.serial_number + ')')}`;
                    if (item.dept_name && item.dept_name !== 'nan') {
                        queryParams += `&dept=${encodeURIComponent(item.dept_name)}`;
                    }
                    const qrPayload = baseUrl + queryParams;

                    // Generate Image String
                    const base64QR = await generateQRBase64(qrPayload);

                    // Calculate Box Position
                    const curX = startX + (col * (labelW + marginX));
                    const curY = startY + (row * (labelH + marginY));

                    // Draw Outer Label Box (Rounded Rectangle)
                    doc.setDrawColor(200, 200, 200);
                    doc.setLineWidth(0.5);
                    doc.roundedRect(curX, curY, labelW, labelH, 2, 2);

                    // Add QR Code Image (Centered)
                    const qrSize = 40;
                    const qrOffset = (labelW - qrSize) / 2;
                    doc.addImage(base64QR, 'PNG', curX + qrOffset, curY + 5, qrSize, qrSize);

                    // Add Text Elements
                    doc.setFontSize(10);
                    doc.setFont('helvetica', 'bold');
                    doc.setTextColor(30, 41, 59); // Slate-800
                    
                    // Truncate name if too long
                    let safeName = item.item_name.length > 25 ? item.item_name.substring(0, 25) + '...' : item.item_name;
                    doc.text(safeName, curX + (labelW / 2), curY + 49, { align: 'center' });

                    doc.setFontSize(9);
                    doc.setFont('helvetica', 'normal');
                    doc.text(`SN: ${item.serial_number}`, curX + (labelW / 2), curY + 54, { align: 'center' });

                    doc.setFontSize(8);
                    doc.setFont('helvetica', 'italic');
                    doc.setTextColor(100, 116, 139); // Slate-500
                    
                    const deptText = (item.dept_name && item.dept_name !== 'nan') ? item.dept_name : 'Master Inventory';
                    let safeDept = deptText.length > 30 ? deptText.substring(0, 30) + '...' : deptText;
                    doc.text(safeDept, curX + (labelW / 2), curY + 59, { align: 'center' });

                    // Grid Math
                    col++;
                    if (col >= cols) {
                        col = 0;
                        row++;
                    }
                    
                    // Page Break logic
                    if (row >= rows && i < itemsArray.length - 1) {
                        doc.addPage();
                        col = 0;
                        row = 0;
                    }
                }

                // Download File
                doc.save(`AMAR_Asset_Tags_${new Date().toISOString().split('T')[0]}.pdf`);
                showSuccess("PDF Tags Generated Successfully.");
                
            } catch (error) {
                console.error("PDF Generation Error:", error);
                showStatus("Error generating PDF. See console.", true);
            }

            btn.innerHTML = origText;
            btn.disabled = false;
        }
    </script>
