<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remove Inventory | NABH Guardian</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#000000',    
                        darkCard: '#111111',  
                        darkBorder: '#262626', 
                        slate: {
                            50: '#fafafa', 100: '#f5f5f5', 200: '#e5e5e5', 300: '#d4d4d4',
                            400: '#a3a3a3', 500: '#737373', 600: '#525252', 700: '#404040',
                            800: '#262626', 900: '#171717', 950: '#0a0a0a',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .custom-scroll::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #525252; border-radius: 10px; }
        .dark .custom-scroll::-webkit-scrollbar-thumb { background: #404040; }
        .table-row-transition { transition: all 0.2s ease; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-darkBg dark:text-slate-200 min-h-screen overflow-x-hidden transition-colors duration-300">

    <!-- Header -->
    <header class="h-14 md:h-16 bg-white dark:bg-darkCard border-b border-gray-200 dark:border-darkBorder flex items-center justify-between px-3 md:px-6 sticky top-0 z-50">
        <div class="flex items-center space-x-3">
            <button onclick="window.history.back()" class="p-1.5 text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
            </button>
            <div class="flex flex-col">
                <h1 class="text-sm md:text-lg font-bold text-slate-800 dark:text-white uppercase tracking-tight">Inventory Cleanup</h1>
                <p class="text-[9px] md:text-[10px] font-bold text-red-600 dark:text-red-400 uppercase tracking-widest">Permanent Removal & Archival</p>
            </div>
        </div>
        
        <button onclick="toggleDarkMode()" class="p-1.5 md:p-2 rounded-lg bg-slate-100 dark:bg-slate-900 border border-transparent dark:border-darkBorder text-slate-600 dark:text-amber-400 transition-transform hover:scale-105">
            <svg id="theme-sun" class="w-4 h-4 hidden dark:block" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"></path></svg>
            <svg id="theme-moon" class="w-4 h-4 block dark:hidden" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
        </button>
    </header>

    <main class="max-w-7xl mx-auto p-4 md:p-8 space-y-6">
        
        <!-- Filter Header -->
        <section class="bg-white dark:bg-darkCard rounded-2xl border border-gray-200 dark:border-darkBorder shadow-sm p-4 md:p-6">
            <div class="flex flex-col md:flex-row gap-4">
                <div class="flex-1 relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    </span>
                    <input type="text" id="search-input" onkeyup="filterItems()" placeholder="Search ID, Name, Serial or Department..." 
                           class="w-full pl-10 pr-4 py-2.5 bg-slate-50 dark:bg-slate-900 border border-gray-200 dark:border-darkBorder rounded-xl outline-none focus:ring-2 focus:ring-blue-500 dark:text-white text-sm transition-all">
                </div>
                <div class="w-full md:w-64">
                    <select id="status-filter" onchange="filterItems()" class="w-full px-3 py-2.5 bg-slate-50 dark:bg-slate-900 border border-gray-200 dark:border-darkBorder rounded-xl outline-none focus:ring-2 focus:ring-blue-500 dark:text-white text-sm font-semibold cursor-pointer transition-all">
                        <option value="all">All Items (Full Store)</option>
                        <option value="assigned">Currently Assigned</option>
                        <option value="in-store">In Store (Unassigned)</option>
                    </select>
                </div>
            </div>
        </section>

        <!-- Master Table -->
        <section class="bg-white dark:bg-darkCard rounded-2xl border border-gray-200 dark:border-darkBorder shadow-sm flex flex-col overflow-hidden">
            <div class="flex-1 overflow-x-auto custom-scroll">
                <table class="w-full text-left border-collapse min-w-[1000px]">
                    <thead>
                        <tr class="bg-slate-50 dark:bg-slate-900/50 border-b border-gray-200 dark:border-darkBorder">
                            <th class="px-6 py-4 text-[10px] font-bold text-slate-500 uppercase tracking-widest">Item ID</th>
                            <th class="px-6 py-4 text-[10px] font-bold text-slate-500 uppercase tracking-widest">Asset Information</th>
                            <th class="px-6 py-4 text-[10px] font-bold text-slate-500 uppercase tracking-widest">Status / Location</th>
                            <th class="px-6 py-4 text-[10px] font-bold text-slate-500 uppercase tracking-widest text-right">Delete Action</th>
                        </tr>
                    </thead>
                    <tbody id="inventory-table-body" class="divide-y divide-gray-100 dark:divide-darkBorder">
                        <!-- Loaded via AJAX -->
                    </tbody>
                </table>
                
                <div id="loader" class="py-20 text-center flex flex-col items-center">
                    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-red-600 mb-3"></div>
                    <p class="text-xs font-bold text-slate-500 uppercase tracking-widest">Fetching Master Inventory...</p>
                </div>

                <div id="empty-state" class="hidden py-20 text-center text-slate-400">
                    <svg class="w-16 h-16 mx-auto mb-4 opacity-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
                    <p class="text-sm font-bold uppercase tracking-widest">No items found matching filters.</p>
                </div>
            </div>
        </section>
    </main>

    <!-- Confirmation Modal -->
    <div id="delete-modal" class="fixed inset-0 z-[100] hidden items-center justify-center px-4">
        <div class="absolute inset-0 bg-black/80 backdrop-blur-sm" onclick="closeModal()"></div>
        <div class="relative w-full max-w-sm bg-white dark:bg-darkCard rounded-3xl shadow-2xl p-8 text-center border border-gray-200 dark:border-darkBorder">
            <div class="w-16 h-16 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-6">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
            </div>
            <h3 class="text-xl font-bold text-slate-800 dark:text-white mb-2 uppercase tracking-tight">Confirm Deletion</h3>
            <p id="modal-desc" class="text-sm text-slate-500 dark:text-slate-400 mb-8 leading-relaxed"></p>
            
            <button id="confirm-btn" class="w-full py-3 bg-red-600 text-white font-bold rounded-xl shadow-lg hover:bg-red-700 transition-all uppercase text-xs tracking-widest mb-3">
                Remove From System
            </button>
            <button onclick="closeModal()" class="w-full py-2 text-slate-500 font-bold hover:text-slate-700 dark:text-slate-400 text-xs uppercase tracking-widest">Cancel</button>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 px-6 py-3 rounded-2xl text-sm font-bold text-white shadow-2xl opacity-0 transition-all pointer-events-none z-[200] whitespace-nowrap"></div>

    <script>
        const activeUserId = localStorage.getItem('active_user_id');
        let inventoryData = [];
        let itemToDelete = null;

        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
        }
        if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');

        function showStatus(msg, isError = false) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.className = `fixed bottom-8 left-1/2 -translate-x-1/2 px-6 py-3 rounded-2xl text-sm font-bold text-white shadow-2xl transition-all z-[200] ${isError ? 'bg-red-600' : 'bg-slate-900 dark:bg-slate-800'}`;
            t.classList.remove('opacity-0'); t.classList.add('translate-y-[-10px]', 'opacity-100');
            setTimeout(() => { t.classList.add('opacity-0'); t.classList.remove('translate-y-[-10px]', 'opacity-100'); }, 3000);
        }

        document.addEventListener('DOMContentLoaded', fetchInventory);

        async function fetchInventory() {
            try {
                const fd = new FormData();
                fd.append('action', 'fetch_removal_list');
                
                const res = await fetch('../scripts/process_inventory_removal.php', { method: 'POST', body: fd });
                const json = await res.json();
                
                if(json.status === 'success') {
                    inventoryData = json.data;
                    renderTable(inventoryData);
                }
            } catch(e) { showStatus("Connection Error", true); }
            document.getElementById('loader').classList.add('hidden');
        }

        function renderTable(data) {
            const tbody = document.getElementById('inventory-table-body');
            const empty = document.getElementById('empty-state');
            tbody.innerHTML = '';
            
            if(data.length === 0) {
                empty.classList.remove('hidden');
                return;
            }
            empty.classList.add('hidden');

            data.forEach(item => {
                const isAssigned = item.dept_name !== null;
                const statusBadge = isAssigned 
                    ? `<span class="px-2.5 py-1 bg-blue-100 dark:bg-blue-900/30 text-blue-700 dark:text-blue-400 text-[10px] font-bold rounded-lg border border-blue-200 dark:border-blue-800 uppercase tracking-tighter">${item.dept_name}</span>`
                    : `<span class="px-2.5 py-1 bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 text-[10px] font-bold rounded-lg border border-slate-200 dark:border-slate-700 uppercase tracking-tighter">In Store</span>`;

                tbody.innerHTML += `
                    <tr class="table-row-transition hover:bg-slate-50 dark:hover:bg-slate-900/50 group">
                        <td class="px-6 py-4 font-mono text-xs font-bold text-blue-600 dark:text-blue-400">#${item.item_id}</td>
                        <td class="px-6 py-4">
                            <p class="text-sm font-bold text-slate-800 dark:text-slate-200">${item.item_name}</p>
                            <p class="text-[10px] text-slate-500 font-mono mt-0.5 uppercase">${item.item_model} • SN: ${item.serial_number}</p>
                        </td>
                        <td class="px-6 py-4">${statusBadge}</td>
                        <td class="px-6 py-4 text-right">
                            <button onclick="confirmDelete(${JSON.stringify(item).replace(/"/g, '&quot;')})" 
                                    class="p-2 text-slate-400 hover:text-red-600 transition-colors">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            </button>
                        </td>
                    </tr>`;
            });
        }

        function filterItems() {
            const search = document.getElementById('search-input').value.toLowerCase();
            const status = document.getElementById('status-filter').value;

            const filtered = inventoryData.filter(i => {
                const matchSearch = i.item_name.toLowerCase().includes(search) || 
                                    i.item_id.toString().includes(search) || 
                                    i.serial_number.toLowerCase().includes(search) ||
                                    (i.dept_name && i.dept_name.toLowerCase().includes(search)) ||
                                    (i.dept_id && i.dept_id.toLowerCase().includes(search));
                
                let matchStatus = true;
                if(status === 'assigned') matchStatus = i.dept_name !== null;
                if(status === 'in-store') matchStatus = i.dept_name === null;

                return matchSearch && matchStatus;
            });
            renderTable(filtered);
        }

        function confirmDelete(item) {
            itemToDelete = item;
            const desc = document.getElementById('modal-desc');
            const locText = item.dept_name ? `currently assigned to <b>${item.dept_name}</b>` : `currently in the general store`;
            
            desc.innerHTML = `Are you sure you want to remove <b>${item.item_name}</b> (${item.item_model})? <br><br> This item is ${locText}. history will be archived.`;
            
            document.getElementById('delete-modal').classList.remove('hidden');
            document.getElementById('delete-modal').classList.add('flex');
            
            document.getElementById('confirm-btn').onclick = executeDelete;
        }

        function closeModal() {
            document.getElementById('delete-modal').classList.add('hidden');
            document.getElementById('delete-modal').classList.remove('flex');
            itemToDelete = null;
        }

        async function executeDelete() {
            if(!itemToDelete) return;
            const btn = document.getElementById('confirm-btn');
            btn.disabled = true; btn.innerText = "Processing...";

            const fd = new FormData();
            fd.append('action', 'delete_item');
            fd.append('item_id', itemToDelete.item_id);
            fd.append('dept_id', itemToDelete.dept_id || 'NAN');

            try {
                const res = await fetch('../scripts/process_inventory_removal.php', { method: 'POST', body: fd });
                const json = await res.json();
                if(json.status === 'success') {
                    showStatus(json.message);
                    closeModal();
                    await fetchInventory();
                } else { showStatus(json.message, true); }
            } catch(e) { showStatus("Database Error", true); }
            
            btn.disabled = false; btn.innerText = "Remove From System";
        }
    </script>
</body>
</html>
