<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log New Purchases | NABH Guardian</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        /* DEEP INDIGO THEME for Purchase Logging */
                        darkBg: '#0a0a14',    
                        darkCard: '#111322',  
                        darkBorder: '#1e213a', 
                        slate: {
                            50: '#fafafa', 100: '#f5f5f5', 200: '#e5e5e5', 300: '#d4d4d4',
                            400: '#a3a3a3', 500: '#737373', 600: '#525252', 700: '#404040',
                            800: '#262626', 900: '#171717', 950: '#0a0a0a',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .custom-scroll::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #525252; border-radius: 10px; }
        .dark .custom-scroll::-webkit-scrollbar-thumb { background: #404040; }
    </style>
</head>
<body class="bg-indigo-50/30 dark:bg-darkBg dark:text-slate-200 min-h-screen overflow-x-hidden transition-colors duration-300">

    <!-- Header -->
    <header class="h-14 md:h-16 bg-white dark:bg-darkCard border-b border-gray-200 dark:border-darkBorder flex items-center justify-between px-3 md:px-6 sticky top-0 z-50 shadow-sm">
        <div class="flex items-center space-x-3">
            <button onclick="window.history.back()" class="p-1.5 text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
            </button>
            <div class="flex flex-col">
                <h1 class="text-sm md:text-lg font-bold text-slate-800 dark:text-white uppercase tracking-tight">Log New Purchases</h1>
                <p class="text-[9px] md:text-[10px] font-bold text-indigo-600 dark:text-indigo-400 uppercase tracking-widest">Procurement Entry</p>
            </div>
        </div>
        
        <div class="flex items-center space-x-4">
            <div class="hidden sm:flex items-center space-x-2 text-xs font-bold text-slate-500 dark:text-slate-400">
                <span>Officer ID:</span>
                <span id="header-user-id" class="text-indigo-600 dark:text-indigo-400 uppercase tracking-widest">Loading...</span>
            </div>
            <button onclick="toggleDarkMode()" class="p-1.5 md:p-2 rounded-lg bg-slate-100 dark:bg-slate-900 border border-transparent dark:border-darkBorder text-slate-600 dark:text-amber-400 transition-transform hover:scale-105">
                <svg id="theme-sun" class="w-4 h-4 hidden dark:block" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"></path></svg>
                <svg id="theme-moon" class="w-4 h-4 block dark:hidden" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
            </button>
        </div>
    </header>

    <main class="max-w-5xl mx-auto p-4 md:p-8 space-y-6 md:space-y-10">
        
        <!-- Section 1: Bulk Import -->
        <section class="bg-white dark:bg-darkCard rounded-2xl md:rounded-3xl border border-gray-200 dark:border-darkBorder shadow-sm overflow-hidden transition-all">
            <div class="p-5 md:p-8 border-b border-gray-100 dark:border-darkBorder flex flex-col md:flex-row md:items-center justify-between gap-4 bg-slate-50/50 dark:bg-slate-900/20">
                <div>
                    <h2 class="text-lg md:text-xl font-bold text-slate-800 dark:text-white">Bulk Purchase Import</h2>
                    <p class="text-[10px] md:text-xs text-slate-500 uppercase font-bold tracking-widest mt-1">Upload CSV Spreadsheet</p>
                </div>
                <button onclick="downloadBlueprint()" class="relative z-20 flex items-center space-x-2 px-4 py-2 bg-slate-800 dark:bg-slate-700 text-white rounded-xl text-xs font-bold hover:bg-slate-700 transition-all shadow-md">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    <span>Download CSV Blueprint</span>
                </button>
            </div>
            
            <div class="p-6 md:p-10 text-center">
                <div id="drop-zone" class="relative border-2 border-dashed border-indigo-200 dark:border-indigo-900/50 bg-indigo-50/20 dark:bg-indigo-900/5 rounded-2xl p-8 md:p-12 transition-all hover:bg-indigo-50/40 dark:hover:bg-indigo-900/10 group cursor-pointer overflow-hidden">
                    <input type="file" id="bulk-file" accept=".csv" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" onchange="handleFileSelect(event)">
                    
                    <div id="upload-prompt">
                        <div class="w-14 h-14 bg-indigo-600 text-white rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg group-hover:scale-110 transition-transform">
                            <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                        </div>
                        <p class="text-sm md:text-base font-bold text-slate-700 dark:text-slate-300">Click or Drag CSV here to upload</p>
                        <p class="text-[10px] text-slate-400 mt-1 uppercase tracking-widest">Supports missing dates (auto-fills to today)</p>
                    </div>

                    <div id="file-info" class="hidden flex-col items-center relative z-20">
                        <div class="bg-indigo-50 dark:bg-indigo-900/30 px-6 py-4 rounded-2xl border border-indigo-100 dark:border-indigo-800">
                            <p id="file-name" class="text-indigo-700 dark:text-indigo-400 font-bold text-sm flex items-center">
                                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                                <span id="display-name">filename.csv</span>
                            </p>
                        </div>
                        <button id="bulk-submit-btn" onclick="uploadBulkItems()" class="mt-4 px-8 py-2.5 bg-indigo-600 text-white rounded-xl text-sm font-bold shadow-lg hover:bg-indigo-700 transition-all active:scale-95">Import Purchases</button>
                        <button onclick="resetUpload()" class="mt-3 text-[10px] text-red-500 font-bold uppercase tracking-widest hover:text-red-600 hover:underline transition-all">Remove File</button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Section 2: Manual Addition -->
        <section class="bg-white dark:bg-darkCard rounded-2xl md:rounded-3xl border border-gray-200 dark:border-darkBorder shadow-sm overflow-hidden transition-all">
            <div class="p-5 md:p-8 border-b border-gray-100 dark:border-darkBorder bg-slate-50/50 dark:bg-slate-900/20">
                <h2 class="text-lg md:text-xl font-bold text-slate-800 dark:text-white">Manual Purchase Entry</h2>
                <p class="text-[10px] md:text-xs text-slate-500 uppercase font-bold tracking-widest mt-1">Register single equipment row</p>
            </div>
            
            <form id="manual-item-form" onsubmit="submitManualItem(event)" class="p-6 md:p-10 space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5 md:gap-8">
                    <div>
                        <label class="block text-[10px] md:text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Item Name <span class="text-red-500">*</span></label>
                        <input type="text" name="item_name" required placeholder="e.g., Defibrillator" class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-900 border border-gray-100 dark:border-darkBorder rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 dark:text-white text-sm transition-all">
                    </div>
                    <div>
                        <label class="block text-[10px] md:text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Model Number <span class="text-red-500">*</span></label>
                        <input type="text" name="item_model" required placeholder="e.g., XL-500 Plus" class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-900 border border-gray-100 dark:border-darkBorder rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 dark:text-white text-sm transition-all">
                    </div>
                    <div>
                        <label class="block text-[10px] md:text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Manufacturer <span class="text-red-500">*</span></label>
                        <input type="text" name="item_manufacturer" required placeholder="e.g., Philips Healthcare" class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-900 border border-gray-100 dark:border-darkBorder rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 dark:text-white text-sm transition-all">
                    </div>
                    <div>
                        <label class="block text-[10px] md:text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Serial Number <span class="text-red-500">*</span></label>
                        <input type="text" name="serial_number" required placeholder="Unique ID from factory" class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-900 border border-gray-100 dark:border-darkBorder rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 dark:text-white text-sm transition-all">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-[10px] md:text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Date Purchased (Optional)</label>
                        <input type="date" name="date_purchased" class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-900 border border-gray-100 dark:border-darkBorder rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 dark:text-white text-sm transition-all">
                        <p class="text-[9px] text-slate-400 mt-1.5 uppercase font-bold tracking-widest">Leave blank to use current date.</p>
                    </div>
                </div>

                <div class="pt-6 border-t border-gray-50 dark:border-darkBorder flex justify-end">
                    <button type="submit" id="manual-btn" class="w-full md:w-auto px-10 py-3.5 bg-indigo-600 text-white rounded-2xl text-sm font-bold shadow-lg hover:bg-indigo-700 transition-all flex items-center justify-center space-x-2">
                        <span>Save to Purchased Items</span>
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                    </button>
                </div>
            </form>
        </section>

    </main>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 px-6 py-3 rounded-2xl text-sm font-bold text-white shadow-2xl opacity-0 transition-all pointer-events-none z-[100] whitespace-nowrap"></div>

    <script>
        const activeUserId = localStorage.getItem('active_user_id');

        document.addEventListener('DOMContentLoaded', () => {
            if (!activeUserId) {
                window.location.href = "../login.html";
                return;
            }
            document.getElementById('header-user-id').innerText = activeUserId;
        });

        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
        }
        if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');

        function showStatus(msg, isError = false) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.className = `fixed bottom-8 left-1/2 -translate-x-1/2 px-6 py-3 rounded-2xl text-sm font-bold text-white shadow-2xl transition-all z-[100] ${isError ? 'bg-red-600' : 'bg-slate-900 dark:bg-slate-800'}`;
            t.classList.remove('opacity-0');
            t.classList.add('translate-y-[-10px]', 'opacity-100');
            setTimeout(() => {
                t.classList.add('opacity-0');
                t.classList.remove('translate-y-[-10px]', 'opacity-100');
            }, 3000);
        }

        // --- Manual Addition ---
        async function submitManualItem(e) {
            e.preventDefault();
            const btn = document.getElementById('manual-btn');
            const originalText = btn.innerHTML;
            btn.disabled = true; btn.innerText = "Saving...";

            const formData = new FormData(e.target);
            formData.append('action', 'manual');
            formData.append('user_id', activeUserId); // Attached from local storage

            try {
                const res = await fetch('../scripts/process_purchased_items.php', { method: 'POST', body: formData });
                const json = await res.json();
                if(json.status === 'success') {
                    showStatus(json.message);
                    e.target.reset();
                } else {
                    showStatus(json.message, true);
                }
            } catch(error) { 
                showStatus("Server Error. Check console.", true); 
                console.error(error);
            }

            btn.disabled = false; btn.innerHTML = originalText;
        }

        // --- Bulk Import ---
        function downloadBlueprint() {
            // Blueprint updated to include date_purchased
            const headers = "item_name,item_model,item_manufacturer,serial_number,date_purchased";
            const blob = new Blob([headers], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('href', url);
            a.setAttribute('download', 'Purchased_Items_Blueprint.csv');
            a.click();
        }

        function handleFileSelect(e) {
            const file = e.target.files[0];
            if(!file) return;
            document.getElementById('upload-prompt').classList.add('hidden');
            document.getElementById('file-info').classList.remove('hidden');
            document.getElementById('display-name').innerText = file.name;
        }

        function resetUpload() {
            document.getElementById('bulk-file').value = '';
            document.getElementById('upload-prompt').classList.remove('hidden');
            document.getElementById('file-info').classList.add('hidden');
        }

        async function uploadBulkItems() {
            const fileInput = document.getElementById('bulk-file');
            if(!fileInput.files[0]) {
                showStatus("No file selected", true);
                return;
            }

            const btn = document.getElementById('bulk-submit-btn');
            const origText = btn.innerText;
            btn.disabled = true;
            btn.innerText = "Processing File...";

            const formData = new FormData();
            formData.append('csv_file', fileInput.files[0]);
            formData.append('action', 'bulk');
            formData.append('user_id', activeUserId); // Attached from local storage

            try {
                const res = await fetch('../scripts/process_purchased_items.php', { method: 'POST', body: formData });
                const json = await res.json();
                if(json.status === 'success') {
                    showStatus(json.message);
                    resetUpload();
                } else {
                    showStatus(json.message, true);
                    resetUpload();
                }
            } catch(e) { 
                showStatus("Bulk Upload Error. Check console.", true); 
                console.error(e);
                resetUpload();
            }

            btn.disabled = false;
            btn.innerText = origText;
        }
    </script>
</body>
</html>
