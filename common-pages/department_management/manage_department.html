<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Departments | NABH Guardian</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#000000',    
                        darkCard: '#111111',  
                        darkBorder: '#262626', 
                        slate: {
                            50: '#fafafa', 100: '#f5f5f5', 200: '#e5e5e5', 300: '#d4d4d4',
                            400: '#a3a3a3', 500: '#737373', 600: '#525252', 700: '#404040',
                            800: '#262626', 900: '#171717', 950: '#0a0a0a',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .custom-scroll::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #525252; border-radius: 10px; }
        .dark .custom-scroll::-webkit-scrollbar-thumb { background: #404040; }
        .table-row-transition { transition: all 0.2s ease; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-darkBg dark:text-slate-200 min-h-screen overflow-x-hidden transition-colors duration-300">

    <!-- Header -->
    <header class="h-14 md:h-16 bg-white dark:bg-darkCard border-b border-gray-200 dark:border-darkBorder flex items-center justify-between px-3 md:px-6 sticky top-0 z-50">
        <div class="flex items-center space-x-3">
            <button onclick="window.history.back()" class="p-1.5 text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
            </button>
            <div class="flex flex-col">
                <h1 class="text-sm md:text-lg font-bold text-slate-800 dark:text-white uppercase tracking-tight">Department Directory</h1>
                <p class="text-[9px] md:text-[10px] font-bold text-blue-600 dark:text-blue-400 uppercase tracking-widest">Facility Structure Management</p>
            </div>
        </div>
        
        <button onclick="toggleDarkMode()" class="p-1.5 md:p-2 rounded-lg bg-slate-100 dark:bg-slate-900 border border-transparent dark:border-darkBorder text-slate-600 dark:text-amber-400 transition-transform hover:scale-105">
            <svg id="theme-sun" class="w-4 h-4 hidden dark:block" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"></path></svg>
            <svg id="theme-moon" class="w-4 h-4 block dark:hidden" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
        </button>
    </header>

    <main class="max-w-6xl mx-auto p-4 md:p-8 space-y-6">
        
        <!-- Action Bar: Add & Search -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Add Form -->
            <section class="lg:col-span-1 bg-white dark:bg-darkCard rounded-2xl border border-gray-200 dark:border-darkBorder shadow-sm p-6">
                <h2 class="text-base font-bold text-slate-800 dark:text-white mb-4 uppercase tracking-wider">New Department</h2>
                <form id="add-dept-form" onsubmit="addDepartment(event)" class="space-y-4">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Department ID</label>
                        <input type="text" id="new-dept-id" required placeholder="e.g., DEPT-ICU" 
                               class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-gray-200 dark:border-darkBorder rounded-lg outline-none focus:ring-2 focus:ring-blue-500 dark:text-white text-sm transition-all">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Department Name</label>
                        <input type="text" id="new-dept-name" required placeholder="e.g., Intensive Care Unit" 
                               class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-gray-200 dark:border-darkBorder rounded-lg outline-none focus:ring-2 focus:ring-blue-500 dark:text-white text-sm transition-all">
                    </div>
                    <button type="submit" id="add-btn" class="w-full py-2.5 bg-blue-600 text-white rounded-xl text-sm font-bold shadow-lg hover:bg-blue-700 transition-all flex items-center justify-center space-x-2">
                        <span>Add Department</span>
                    </button>
                </form>
            </section>

            <!-- Table & Search -->
            <section class="lg:col-span-2 bg-white dark:bg-darkCard rounded-2xl border border-gray-200 dark:border-darkBorder shadow-sm flex flex-col overflow-hidden">
                <div class="p-5 border-b border-gray-100 dark:border-darkBorder flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-slate-50/50 dark:bg-slate-900/20">
                    <h2 class="text-base font-bold text-slate-800 dark:text-white uppercase tracking-wider">Master List</h2>
                    <div class="relative w-full md:w-64">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                        </span>
                        <input type="text" id="search-dept" onkeyup="filterDepartments()" placeholder="Search ID or Name..." 
                               class="w-full pl-9 pr-4 py-2 bg-white dark:bg-slate-800 border border-gray-200 dark:border-darkBorder rounded-xl text-xs outline-none focus:ring-2 focus:ring-blue-500 dark:text-white transition-all">
                    </div>
                </div>

                <div class="flex-1 overflow-x-auto custom-scroll">
                    <table class="w-full text-left border-collapse min-w-[500px]">
                        <thead>
                            <tr class="bg-slate-50 dark:bg-slate-900/50 border-b border-gray-200 dark:border-darkBorder">
                                <th class="px-6 py-3 text-[10px] font-bold text-slate-500 uppercase tracking-widest">Dept ID</th>
                                <th class="px-6 py-3 text-[10px] font-bold text-slate-500 uppercase tracking-widest">Name</th>
                                <th class="px-6 py-3 text-[10px] font-bold text-slate-500 uppercase tracking-widest">Created On</th>
                                <th class="px-6 py-3 text-[10px] font-bold text-slate-500 uppercase tracking-widest text-right">Action</th>
                            </tr>
                        </thead>
                        <tbody id="dept-table-body" class="divide-y divide-gray-100 dark:divide-darkBorder">
                            <!-- Dynamic Rows -->
                        </tbody>
                    </table>
                    <div id="empty-state" class="hidden flex-col items-center justify-center py-12 text-slate-400">
                        <svg class="w-12 h-12 mb-3 opacity-20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
                        <p class="text-sm font-medium">No departments found.</p>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <!-- Delete Confirmation Modal -->
    <div id="delete-modal" class="fixed inset-0 z-[100] hidden items-center justify-center px-4">
        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="closeDeleteModal()"></div>
        <div class="relative w-full max-w-sm bg-white dark:bg-darkCard rounded-2xl shadow-2xl border border-gray-200 dark:border-darkBorder flex flex-col p-8 text-center transform transition-all">
            <div class="w-16 h-16 bg-red-100 dark:bg-red-900/30 text-red-600 dark:text-red-400 rounded-full flex items-center justify-center mx-auto mb-5">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
            </div>
            <h3 class="text-xl font-bold text-slate-800 dark:text-white mb-2 tracking-tight uppercase">Delete Department?</h3>
            <p class="text-sm text-slate-500 dark:text-slate-400 mb-8 leading-relaxed">Removing <span id="del-dept-name" class="font-bold text-slate-700 dark:text-slate-200"></span> will affect all linked equipment assignments.</p>
            <div class="flex flex-col gap-3">
                <button onclick="confirmDelete()" id="confirm-del-btn" class="w-full py-3 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl text-sm transition-colors shadow-lg">Yes, Delete Permanently</button>
                <button onclick="closeDeleteModal()" class="w-full py-3 bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-bold rounded-xl text-sm hover:bg-slate-200 transition-colors">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 px-6 py-3 rounded-2xl text-sm font-bold text-white shadow-2xl opacity-0 transition-all pointer-events-none z-[200] whitespace-nowrap"></div>

    <script>
        const activeUserId = localStorage.getItem('active_user_id');
        let allDepts = [];
        let deptToDelete = null;

        function toggleDarkMode() {
            const html = document.documentElement;
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
        }
        if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');

        function showStatus(msg, isError = false) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.className = `fixed bottom-8 left-1/2 -translate-x-1/2 px-6 py-3 rounded-2xl text-sm font-bold text-white shadow-2xl transition-all z-[200] ${isError ? 'bg-red-600' : 'bg-slate-900 dark:bg-slate-800'}`;
            t.classList.remove('opacity-0');
            t.classList.add('translate-y-[-10px]', 'opacity-100');
            setTimeout(() => {
                t.classList.add('opacity-0');
                t.classList.remove('translate-y-[-10px]', 'opacity-100');
            }, 3000);
        }

        document.addEventListener('DOMContentLoaded', fetchDepartments);

        async function fetchDepartments() {
            try {
                const formData = new FormData();
                formData.append('action', 'fetch');
                formData.append('admin_id', activeUserId);
                
                const res = await fetch('process_departments.php', { method: 'POST', body: formData });
                const json = await res.json();
                
                if(json.status === 'success') {
                    allDepts = json.data;
                    renderTable(allDepts);
                }
            } catch(e) { 
                console.error(e);
                showStatus("Error loading department data", true);
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById('dept-table-body');
            const empty = document.getElementById('empty-state');
            tbody.innerHTML = '';

            if (data.length === 0) {
                empty.classList.remove('hidden');
                return;
            }
            empty.classList.add('hidden');

            data.forEach(dept => {
                const row = `
                    <tr class="table-row-transition hover:bg-slate-50 dark:hover:bg-slate-900 group">
                        <td class="px-6 py-4 font-mono text-xs text-blue-600 dark:text-blue-400 font-bold">${dept.dept_id}</td>
                        <td class="px-6 py-4 text-sm font-semibold text-slate-700 dark:text-slate-200">${dept.dept_name}</td>
                        <td class="px-6 py-4 text-xs text-slate-500">${new Date(dept.date_created).toLocaleDateString()}</td>
                        <td class="px-6 py-4 text-right">
                            <button onclick="openDeleteModal('${dept.dept_id}', '${dept.dept_name}')" class="p-2 text-slate-400 hover:text-red-600 dark:hover:text-red-400 transition-colors">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            </button>
                        </td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        }

        function filterDepartments() {
            const term = document.getElementById('search-dept').value.toLowerCase();
            const filtered = allDepts.filter(d => 
                d.dept_id.toLowerCase().includes(term) || 
                d.dept_name.toLowerCase().includes(term)
            );
            renderTable(filtered);
        }

        async function addDepartment(e) {
            e.preventDefault();
            const btn = document.getElementById('add-btn');
            btn.disabled = true;
            btn.innerText = "Processing...";

            const formData = new FormData();
            formData.append('action', 'add');
            formData.append('admin_id', activeUserId);
            formData.append('dept_id', document.getElementById('new-dept-id').value);
            formData.append('dept_name', document.getElementById('new-dept-name').value);

            try {
                const res = await fetch('process_departments.php', { method: 'POST', body: formData });
                const json = await res.json();
                if(json.status === 'success') {
                    showStatus(json.message);
                    e.target.reset();
                    fetchDepartments();
                } else {
                    showStatus(json.message, true);
                }
            } catch(e) { showStatus("Server error", true); }
            
            btn.disabled = false;
            btn.innerText = "Add Department";
        }

        function openDeleteModal(id, name) {
            deptToDelete = id;
            document.getElementById('del-dept-name').innerText = name;
            document.getElementById('delete-modal').classList.remove('hidden');
            document.getElementById('delete-modal').classList.add('flex');
        }

        function closeDeleteModal() {
            document.getElementById('delete-modal').classList.add('hidden');
            document.getElementById('delete-modal').classList.remove('flex');
        }

        async function confirmDelete() {
            const btn = document.getElementById('confirm-del-btn');
            btn.disabled = true;
            btn.innerText = "Deleting...";

            const formData = new FormData();
            formData.append('action', 'delete');
            formData.append('admin_id', activeUserId);
            formData.append('dept_id', deptToDelete);

            try {
                const res = await fetch('process_departments.php', { method: 'POST', body: formData });
                const json = await res.json();
                if(json.status === 'success') {
                    showStatus(json.message);
                    closeDeleteModal();
                    fetchDepartments();
                } else {
                    showStatus(json.message, true);
                }
            } catch(e) { showStatus("Delete Error", true); }
            
            btn.disabled = false;
            btn.innerText = "Yes, Delete Permanently";
        }
    </script>
</body>
</html>
